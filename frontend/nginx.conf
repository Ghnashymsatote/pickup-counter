server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: /orders/<id> is a client-side route, so a reload or a
    # shared link has to fall back to index.html instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are safe to cache for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy would not reach the screen.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
