name: pickup-counter

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pickup_counter
      POSTGRES_USER: pickup_user
      POSTGRES_PASSWORD: dev_password
    # Published on 5434 so it does not clash with a Postgres already
    # installed on the host.
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickup_user -d pickup_counter"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: postgresql://pickup_user:dev_password@db:5432/pickup_counter
      # Shared secret for the X-Signature HMAC. Change it for any real
      # deployment; the backend refuses to start without one.
      WEBHOOK_SECRET: local_assignment_test_secret_change_me
      HOLD_SECONDS: 120
      CORS_ORIGIN: "*"
      # There is no real payment provider in this build, so the customer
      # screen needs the signed-simulation endpoint.
      ENABLE_PAYMENT_SIMULATION: "true"
      # The backend applies sql/ on boot, so an empty volume still produces
      # a working app from a single `docker compose up`.
      RUN_MIGRATIONS_ON_BOOT: "true"
    ports:
      - "5001:5001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:5001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite inlines this at build time. It is the URL the *browser* uses,
        # so it is the host-published port, not the compose service name.
        VITE_API_URL: http://localhost:5001
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
