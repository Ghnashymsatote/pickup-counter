
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pickup_counter
      POSTGRES_USER: pickup_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickup_user -d pickup_counter"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
