services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pickup_counter
      POSTGRES_USER: pickup_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pickup_user -d pickup_counter" ]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 5001
      DATABASE_URL: postgresql://pickup_user:dev_password@db:5432/pickup_counter
      WEBHOOK_SECRET: local_assignment_test_secret_change_me
      API_BASE_URL: http://localhost:5001
    ports:
      - "5001:5001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
